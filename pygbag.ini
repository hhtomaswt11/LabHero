[DEPENDENCIES]
# Keep the browser archive focused on files that are actually used at runtime.
# Pygbag's directory filter works on slash-prefixed project paths; these are
# development/deployment artefacts or source documentation, not game assets.
ignoreDirs = ["/.venv", "/installer", "/backend", "/outputs", "/tmp", "/build-aux", "/graphics/wip", "/tests", "/backup_map", "/planning", "/deploy", "/data/books", "/data/missions"]

# ignoreFiles matches basenames.  iML1515 is retained in the repository for
# development/history but is not referenced by the LabHero runtime.  The
# remaining entries are project notes/manifests that should not travel in the
# student's browser download.
ignoreFiles = ["LabHero.ico", "LabHero.icns", "video_labhero.jpg", "CITATION.cff", "README.md", "LICENSE", "requirements.txt", "pygbag.ini", "data.txt", "results.txt", "simulation_file.txt", "iML1515.xml", "iML1515.xml.gz", "CHECKPOINT_B_PATCH_MANIFEST.txt", "CHECKPOINT_C_PATCH_MANIFEST.txt", "CHECKPOINT_D1_PATCH_MANIFEST.txt", "CHECKPOINT_D2A_PATCH_MANIFEST.txt", "CHECKPOINT_D2B_PATCH_MANIFEST.txt", "CHECKPOINT_D2C_PATCH_MANIFEST.txt", "MISSION36_PATCH_README.txt", "MISSION_PROGRESS_OVERVIEW.md", "Mission33_ROOM_FIX_TEST_PLAN.txt", "Mission34_TEST_PLAN.txt", "Mission35_TEST_PLAN.txt", "PATCH_MANIFEST.txt", "PATCH_MANIFEST_MISSION40.txt", "YEAST_SIMULATOR_TEST_PLAN.txt", "roadmap.md", "roadmapv2.md"]
