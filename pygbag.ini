[DEPENDENCIES]
# Keep the browser archive focused on files that are actually used at runtime.
# Pygbag's directory filter works on slash-prefixed project paths; these are
# development/deployment artefacts or source documentation, not game assets.
ignoreDirs = ["/.venv", "/installer", "/backend", "/outputs", "/tmp", "/build-aux", "/graphics/wip", "/tests", "/backup_map", "/planning", "/deploy", "/data/books", "/data/missions"]

# ignoreFiles matches basenames. Development history now lives under the ignored
# /planning directory, so this list contains only non-runtime root/assets and legacy
# model files that should not travel in the student's browser download.
ignoreFiles = ["LabHero.ico", "LabHero.icns", "video_labhero.jpg", "CITATION.cff", "README.md", "LICENSE", "requirements.txt", "pygbag.ini", "data.txt", "results.txt", "simulation_file.txt", "iML1515.xml", "iML1515.xml.gz"]
