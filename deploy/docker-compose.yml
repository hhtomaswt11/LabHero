services:
  backend:
    build:
      context: ../backend
    container_name: labhero-backend
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: labhero-frontend
    ports:
      - "80:80"
    # Reuse the same host-side teacher credential file created by deploy.sh.
    # Public student routes do not require it; only /teacher* and SHIFT+T auth do.
    volumes:
      - "${HOME}/.config/labhero/teacher.htpasswd:/etc/nginx/.htpasswd:ro"
    depends_on:
      - backend
    restart: unless-stopped
