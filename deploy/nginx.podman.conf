server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's default mime.types (included at the http{} level by the upstream
    # nginx:alpine image) already maps .wasm to application/wasm, .html to
    # text/html, .js to application/javascript, etc. Declaring a `types {}`
    # block in this server scope would REPLACE that inherited map, breaking
    # HTML rendering — don't.

    # The entry point must always be revalidated. A fresh index immediately
    # points clients at the archive produced by the newest deployment.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # deploy/fingerprint_web_bundle.py gives the large Pygbag archive a name
    # derived from its SHA-256. Because the URL changes whenever its bytes do,
    # this resource is safe to keep in the browser cache for a long time.
    location ~ "^/src\.[0-9a-f]{16}\.tar\.gz$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Keep the remaining small, non-fingerprinted files conservative. This
    # avoids stale resources if Pygbag changes its generated file set later.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }


    # Teacher Mode is deliberately outside the public game route. nginx
    # authenticates only the HTML entry document. Pygbag subsequently fetches
    # its relative archive with `credentials: omit`, so protecting every asset
    # below /teacher/ would make the authorised page fail with HTTP 401.
    # Credentials live in /etc/nginx/.htpasswd, mounted read-only by deploy.sh.
    location = /teacher {
        return 302 /teacher/;
    }

    location = /teacher/ {
        auth_basic "LabHero Teacher";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # Do not allow /teacher/index.html to bypass the protected entry point.
    location = /teacher/index.html {
        auth_basic "LabHero Teacher";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # Pygbag assets are byte-for-byte the same public assets already exposed at
    # the root. Serve them without Basic Auth so browser fetches using
    # `credentials: omit` work after the protected HTML has loaded. This does
    # not expose the Teacher entry document itself.
    location ^~ /teacher/ {
        rewrite ^/teacher/(.*)$ /$1 break;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # API proxy inside one Podman pod: /api/simulate -> 127.0.0.1:8000/simulate
    # The trailing slash on proxy_pass strips the /api/ prefix.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # FBA + cobra responses arrive within ~1s for the e_coli_core model,
        # but bump the read timeout in case the backend is cold-starting.
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
