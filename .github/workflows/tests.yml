name: Regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - name: Set isolated data dir
        run: echo "XDG_DATA_HOME=${{ runner.temp }}/labhero-test-data" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r backend/requirements.txt
      - name: Check dependencies and syntax
        run: |
          python -m pip check
          python -m compileall -q code backend/app tests main.py LabHero.py
          bash -n deploy.sh deploy/local_smoke.sh
      - name: Run regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'
